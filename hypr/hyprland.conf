########################################################
### --- GOD LEVEL WINDOW MANAGEMENT (HYPRLAND) --- ###
########################################################

# 1. GLOBAL SETTINGS (The 'Base' Look)
windowrule {
    name = global-aesthetics
    match:class = .*
    float = on
    rounding = 16
    border_size = 2
    opacity = 0.94 override 0.85 override 1.0 override
}

# 2. TERMINAL (The Centerpiece)
# Isko screen ke thoda left-center rakhte hain
windowrule {
    name = terminal-god
    match:class = kitty   # Agar Alacritty use kar rahe ho toh yahan badal dena

    size = (monitor_w*0.55) (monitor_h*0.6)
    move = (monitor_w*0.05) (monitor_h*0.1)
    animation = slide
}

# 3. GOOGLE CHROME (The Big Screen)
# Isko background mein thoda bada aur right-aligned rakhte hain
windowrule {
    name = chrome-god
    match:class = google-chrome
    
    size = (monitor_w*0.7) (monitor_h*0.8)
    move = (monitor_w*0.25) (monitor_h*0.15)
    # Chrome focused ho toh focus highlight mile
    border_color = rgb(33ccff)
}

# 4. FILE MANAGER (The Overlay)
# Ye choti window ki tarah niche-right mein overlap karegi (Video style)
windowrule {
    name = files-god
    match:class = thunar  # Ya nautilus/dolphin jo bhi tum use karo
    
    size = (monitor_w*0.4) (monitor_h*0.5)
    move = (monitor_w*0.55) (monitor_h*0.4)
    dim_around = on        # Jab file manager khule toh peeche ka dim ho jaye
}

# 5. SPECIAL EFFECTS (Dynamic)
# Jab koi window float ho toh halka sa shadow aur dimming
windowrule = match:focus true
    size = (monitor_w*0.7) (monitor_h*0.8)
windowrule = border_color rgb(ff0000), match:fullscreen 1

