#     animation = global,        1,     10,    default
#     animation = border,        1,     2,  easeOutQuint
#     animation = windows,       1,     7,  easeOutQuint
#     animation = windowsIn,     1,     8,   easeOutQuint, popin 87%
#     animation = windowsOut,    1,     8,  linear,       popin 87%
#     # animation = fadeIn,        1,     1.0  almostLinear
#     # animation = fadeOut,       1,     6,  almostLinear
#     animation = fade,          1,     3.03,  quick
#     animation = layers,        1,     3.81,  easeOutQuint
#     animation = layersIn,      1,     4,     easeOutQuint, fade
#     animation = layersOut,     1,     5,   linear,       fade
#     animation = fadeLayersIn,  1,     5,  linear
#     animation = fadeLayersOut, 1,     5,  linear
#     animation = workspacesIn,  1,     5,  linear, 
#     animation = workspacesOut, 1,     5,  linear, 
#     animation = workspaces,    1,     5,  linear, 
#     animation = zoomFactor,    1,     7,     quick
# }
# ----------------------2 Animatin -------------------------
animations {
    enabled = yes

    # ===== Bezier Curves =====
bezier = smoothIn, 0.42, 0, 1.0, 1.0
bezier = smoothOut, 0, 0, 0.58, 1.0
bezier = smoothInOut, 0.42, 0, 0.58, 1.0
bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = easeInQuint, 0.64, 0, 0.78, 0
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = almostLinear, 0.25, 0.25, 0.75, 0.75
bezier = linear, 0, 0, 1, 1
bezier = quick, 0.15, 0, 0.1, 1

    # Global (medium speed)
    animation = global,        1, 3, smoothInOut

    # Windows (slide + slight pop)
    animation = windows,       1, 0.3, easeInOutCubic   
    animation = windowsIn,     1, 0.5, easeInOutCubic, 
    animation = windowsOut,    1, 0.5, easeInOutCubic, 

    # Light fade (not heavy)
    # animation = fade,          1, 8, linear
    # animation = fadeLayersIn,  1, 8, linear
    # animation = fadeLayersOut, 1, 8, linear

    # Border subtle animation
    animation = border,        1, 0.5, quick

    # Workspace slide (clean look)
    animation = workspaces,    1, 0.9, easeOutQuint,
}




